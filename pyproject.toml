[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# Correctness only. Broad excepts are deliberate in a few places (a trace
# write must never stop the trading loop) and are marked where they occur.
select = ["E9", "F", "B"]
ignore = ["B008"]
